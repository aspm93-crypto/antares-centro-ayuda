<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" role="img" aria-labelledby="t"><title id="t">Ejemplo de cómo marcar un audio como favorito y seleccionarlo en el chat</title><rect width="780" height="390" rx="18" fill="#13253b"/><g font-family="Arial,sans-serif"><text x="28" y="38" font-size="15" fill="#86e2ff" font-weight="bold">GUÍA VISUAL · EJEMPLO ILUSTRATIVO</text><rect x="24" y="57" width="732" height="132" rx="12" fill="#f3f8fc"/><text x="45" y="90" font-size="22" font-weight="bold" fill="#13253b">1. Manage Media · Guarda el audio</text><rect x="46" y="108" width="685" height="60" rx="10" fill="#dfedf8"/><text x="66" y="146" font-size="23" fill="#102d46">Saludo de la mañana</text><text x="599" y="147" font-size="28" fill="#855100">☆ → ★</text><rect x="24" y="200" width="732" height="163" rx="12" fill="#f3f8fc"/><text x="45" y="235" font-size="22" font-weight="bold" fill="#13253b">2. Chat · Abre ★ Audios favoritos</text><rect x="46" y="251" width="685" height="60" rx="10" fill="#dfedf8"/><text x="66" y="289" font-size="23" fill="#102d46">Saludo de la mañana</text><rect x="551" y="262" width="164" height="38" rx="8" fill="#155a8a"/><text x="573" y="288" font-size="21" fill="white">Seleccionar</text><text x="46" y="341" font-size="17" fill="#334b64">Comprueba la selección antes de pulsar Enviar en TalkyTimes.</text></g></svg>